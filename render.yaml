# Render Blueprint for the AEGIS backend (FastAPI control loop + API).
services:
  - type: web
    name: aegis-backend
    runtime: python
    plan: free
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn aegis.api:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /api/state
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.7
      - key: GROQ_API_KEY
        sync: false
